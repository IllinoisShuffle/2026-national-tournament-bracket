[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/results"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/live-score"
  [headers.values]
    Cache-Control = "no-store"
