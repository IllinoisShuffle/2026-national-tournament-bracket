<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=6" />
  <title>2026 Chicago National · Tournament Bracket</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#15151A" />
  <script>
    // A direct link/QR code/bookmark can land here on a phone even though
    // index.html would normally have routed it to the mobile layout. Bounce
    // narrow viewports over there too, unless explicitly overridden.
    (function () {
      if (/[?&]kiosk\b/.test(location.search)) {
        document.documentElement.classList.add('kiosk-mode');
      }
      if (/[?&](full|choose)\b/.test(location.search)) return;
      var isNarrow = window.matchMedia && window.matchMedia('(max-width: 700px)').matches;
      if (isNarrow) location.replace('/mobile-bracket');
    })();
  </script>
  <style>
    :root {
      --paper: #F4EEDF;
      --ink: #15151A;
      --ink-dim: rgba(21,21,26,0.55);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1d;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: auto;
    }
    #root {
      width: 100vw;
      height: 100vh;
    }
    .poster-stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
      box-sizing: border-box;
    }
    .poster {
      width: min(95vw, calc((100vh - 48px) * (3300 / 3000)));
      aspect-ratio: 3300 / 3000;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
      background: var(--paper);
      border-radius: 6px;
      overflow: hidden;
      transform-origin: center center;
    }
    .zoom-toolbar {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2147483000;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      font-size: 13px;
      color: #15151A;
    }
    .zoom-toolbar button {
      appearance: none;
      border: none;
      background: #15151A;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .zoom-toolbar .zoom-reset {
      width: auto;
      padding: 0 10px;
      font-size: 12px;
    }
    .zoom-toolbar span {
      min-width: 40px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .poster-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .all-views-link {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 2147483000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      padding: 6px 10px;
      border-radius: 8px;
    }
    .all-views-link:hover { color: #fff; }
    @media print { .all-views-link { display: none; } }

    /* Kiosk / TV mode: no pointer, no chrome, just an auto-panning poster
       plus a caption telling a passerby what section is on screen. */
    .kiosk-mode .all-views-link { display: none; }
    .kiosk-mode .poster-stage { padding: 0; }
    /* Fill the real viewport at its own (often widescreen) aspect ratio
       instead of the poster's print-shaped 3300x3000 box. The auto-pan
       camera (app.jsx) pads each stop's crop to match this real aspect
       ratio before applying one uniform zoom, so every stop fills the
       screen edge-to-edge with no letterboxing *and* no distortion. */
    .kiosk-mode .poster { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
    /* The auto-pan camera crops to a stop's region by panning/zooming a
       fixed-size poster — it has no hard clip at the crop edge, so whatever
       poster content sits just past it (start of the next section) can show
       through in the strip behind the caption pill. This fixed (untransformed)
       gradient sits on top of the poster and fades that strip out, so the
       transition into the caption always reads as deliberate empty space
       rather than a stray sliver of the next section's text. */
    .kiosk-caption-scrim {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 130px;
      z-index: 2147482999;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0));
    }
    .kiosk-caption {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 2147483000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      color: #fff;
      padding: 11px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .kiosk-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2ECC71;
      animation: kiosk-pulse 1.8s infinite;
    }
    @keyframes kiosk-pulse {
      0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
      70% { box-shadow: 0 0 0 10px rgba(46,204,113,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    }
    /* QR overlay: only shown during kiosk mode's zoomed-out "FULL BRACKET"
       stop, pointing viewers to the mobile bracket on their own phone. Fixed
       white card regardless of theme so the code stays scannable against
       either poster background. */
    .kiosk-qr {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 2147483000;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      color: #15151A;
      padding: 16px 22px 16px 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .kiosk-qr img {
      display: block;
      width: 120px;
      height: 120px;
    }
    .kiosk-qr-text {
      max-width: 170px;
    }
    .kiosk-qr-text .kiosk-qr-kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: rgba(21,21,26,0.55);
      margin-bottom: 4px;
    }
    .kiosk-qr-text .kiosk-qr-title {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.2px;
    }
    @media print {
      html, body { background: white; }
      .poster-stage { padding: 0; }
      .poster { width: 100%; height: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>
  <a class="all-views-link" href="/?choose" id="all-views-link">All views ↗</a>
  <script>
    if (/[?&]staff\b/.test(location.search)) {
      document.getElementById('all-views-link').setAttribute('href', '/staff');
    }
  </script>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>

  <!-- Data + layout helpers (plain JS — load before JSX scripts) -->
  <script src="data.js"></script>
  <script src="layout.js"></script>
  <script src="live-data.js"></script>

  <!-- Tweaks panel + sub components -->
  <script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="bracket.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
