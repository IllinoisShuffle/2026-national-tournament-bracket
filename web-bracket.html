<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=6" />
  <title>2026 Chicago National · Tournament Bracket</title>
  <script>
    // A direct link/QR code/bookmark can land here on a phone even though
    // index.html would normally have routed it to the mobile layout. Bounce
    // narrow viewports over there too, unless explicitly overridden.
    (function () {
      if (/[?&]kiosk\b/.test(location.search)) {
        document.documentElement.classList.add('kiosk-mode');
      }
      if (/[?&](full|choose)\b/.test(location.search)) return;
      var isNarrow = window.matchMedia && window.matchMedia('(max-width: 700px)').matches;
      if (isNarrow) location.replace('mobile-bracket.html');
    })();
  </script>
  <style>
    :root {
      --paper: #F4EEDF;
      --ink: #15151A;
      --ink-dim: rgba(21,21,26,0.55);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1d;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: auto;
    }
    #root {
      width: 100vw;
      height: 100vh;
    }
    .poster-stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
      box-sizing: border-box;
    }
    .poster {
      width: min(95vw, calc((100vh - 48px) * (3300 / 3000)));
      aspect-ratio: 3300 / 3000;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
      background: var(--paper);
      border-radius: 6px;
      overflow: hidden;
      transform-origin: center center;
    }
    .zoom-toolbar {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2147483000;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      font-size: 13px;
      color: #15151A;
    }
    .zoom-toolbar button {
      appearance: none;
      border: none;
      background: #15151A;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .zoom-toolbar .zoom-reset {
      width: auto;
      padding: 0 10px;
      font-size: 12px;
    }
    .zoom-toolbar span {
      min-width: 40px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .poster-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .all-views-link {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 2147483000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      padding: 6px 10px;
      border-radius: 8px;
    }
    .all-views-link:hover { color: #fff; }
    @media print { .all-views-link { display: none; } }

    /* Kiosk / TV mode: no pointer, no chrome, just an auto-panning poster
       plus a caption telling a passerby what section is on screen. */
    .kiosk-mode .all-views-link { display: none; }
    .kiosk-mode .poster-stage { padding: 10px; }
    .kiosk-mode .poster { width: min(99vw, calc((100vh - 20px) * (3300 / 3000))); }
    .kiosk-caption {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 2147483000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      color: #fff;
      padding: 11px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .kiosk-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2ECC71;
      animation: kiosk-pulse 1.8s infinite;
    }
    @keyframes kiosk-pulse {
      0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
      70% { box-shadow: 0 0 0 10px rgba(46,204,113,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    }
    @media print {
      html, body { background: white; }
      .poster-stage { padding: 0; }
      .poster { width: 100%; height: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>
  <a class="all-views-link" href="index.html?choose">All views ↗</a>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data + layout helpers (plain JS — load before JSX scripts) -->
  <script src="data.js"></script>
  <script src="layout.js"></script>
  <script src="live-data.js"></script>

  <!-- Tweaks panel + sub components -->
  <script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="bracket.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
