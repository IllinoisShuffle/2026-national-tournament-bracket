<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=6" />
  <title>2026 Chicago National · Print Bracket (Fill-In)</title>
  <style>
    :root { --paper: #F4EEDF; --ink: #15151A; --ink-dim: rgba(21,21,26,0.55); }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a1d; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: auto; }
    #root { width: 100vw; height: 100vh; }
    .poster-stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px; box-sizing: border-box; }
    .poster { width: min(95vw, calc((100vh - 48px) * (3300 / 3000))); aspect-ratio: 3300 / 3000; box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04); background: var(--paper); border-radius: 6px; overflow: hidden; }
    .poster-svg { width: 100%; height: 100%; display: block; }
    @media print {
      html, body { background: white; }
      .poster-stage { padding: 0; }
      .poster { width: 100%; height: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script src="layout.js"></script>
  <script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="bracket.jsx"></script>
  <script type="text/babel" data-presets="react" src="bracket-print.jsx"></script>
  <script type="text/babel" data-presets="react" src="app-print.jsx"></script>
</body>
</html>
