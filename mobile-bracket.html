<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 Chicago National · Mobile Bracket</title>
<style>
:root{--paper:#F4EEDF;--ink:#15151A;--ink-dim:rgba(21,21,26,0.55)}
html,body{margin:0;padding:0;background:#1a1a1d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.m-stage{width:100%;min-height:100vh;display:flex;justify-content:center}
.m-poster{width:100%;max-width:520px;background:var(--paper);color:var(--ink);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,0.4)}
.m-header{padding:28px 20px 20px;text-align:center;border-bottom:2px solid var(--ink)}
.m-logos{display:flex;justify-content:center;gap:16px;margin-bottom:10px}
.m-logo{height:56px;width:auto;object-fit:contain}
.m-lines-strip{display:flex;justify-content:center;gap:4px;margin-bottom:14px}
.m-lines-strip span{width:14px;height:8px;display:block}
.m-header h1{font-size:20px;font-weight:900;letter-spacing:1px;margin:0}
.m-header h2{font-size:26px;font-weight:900;letter-spacing:1.5px;margin:6px 0}
.m-tagline{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--ink-dim);margin:10px 0 4px}
.m-venue{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--ink-dim);margin:0}
.m-section{padding:22px 16px}
.m-section-title{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--ink-dim);text-align:center;margin-bottom:16px}
.m-region-card{margin-bottom:18px;border:1px solid rgba(0,0,0,0.1);border-radius:10px;overflow:hidden}
.m-region-label{padding:8px 12px;font-size:13px;font-weight:800;letter-spacing:1px;color:#fff}
.m-region-label-bus{background:var(--ink);color:var(--paper)}
.m-region-svg{width:100%;display:block}
.m-loop-card{border:2px solid var(--ink);border-radius:14px;padding:18px;text-align:center;margin-top:8px}
.m-loop-title{font-size:22px;font-weight:900;letter-spacing:2px;margin-bottom:14px}
.m-matchup{margin-bottom:16px}
.m-matchup-title{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--ink-dim);margin-bottom:6px}
.m-matchup-team{font-size:14px;font-weight:800}
.m-vs{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--ink-dim);margin:2px 0}
.m-ranking{margin-top:16px;border-top:1px dashed rgba(0,0,0,0.2);padding-top:14px;display:flex;flex-direction:column;align-items:center}
.m-ranking-title{font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--ink-dim);margin-bottom:10px;text-align:center}
.m-ranking-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;text-align:left;width:100%;max-width:220px}
.m-rank-badge{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.m-rank-text{font-size:12px;line-height:1.3;color:var(--ink-dim)}
.m-rank-text b{color:var(--ink);font-size:13px}
.m-divider{text-align:center;font-size:11px;font-weight:800;letter-spacing:1.5px;padding:12px;border-top:1px dashed rgba(0,0,0,0.3);border-bottom:1px dashed rgba(0,0,0,0.3)}
.m-footer{padding:24px 20px 32px;text-align:center;border-top:2px solid var(--ink)}
.m-logo-rp{height:44px;margin-bottom:10px;background:var(--ink);padding:6px 14px;border-radius:6px}
.m-footer p{font-size:11px;font-weight:700;letter-spacing:1px;margin:4px 0}
.m-footer-sub{color:var(--ink-dim);font-size:10px!important}
a{color:var(--ink)}a:hover{color:var(--ink-dim)}
.all-views-link{position:fixed;left:10px;top:10px;z-index:2147483000;font-size:10px;font-weight:700;letter-spacing:0.5px;color:rgba(255,255,255,0.65);text-decoration:none;background:rgba(255,255,255,0.12);padding:5px 8px;border-radius:7px}
</style>
</head>
<body>
<a class="all-views-link" href="index.html?choose">All views ↗</a>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="live-data.js"></script>
<script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="bracket-mobile.jsx"></script>
<script type="text/babel" data-presets="react" src="app-mobile.jsx"></script>
</body>
</html>
