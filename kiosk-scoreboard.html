<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 Chicago National · Kiosk + Live Scoreboard</title>
<style>
  :root { --paper: #F4EEDF; --ink: #15151A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a1d; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .frame-stage { position: fixed; inset: 0; }
  .frame-stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }
  .frame-stage iframe.active { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
  <div class="frame-stage">
    <iframe id="frame-bracket" class="active" src="web-bracket.html?kiosk&full" title="Bracket kiosk"></iframe>
    <iframe id="frame-scoreboard" src="scoreboard.html" title="Live scoreboard"></iframe>
  </div>

  <script>
    // Two full-screen iframes stay mounted the whole time and just cross-fade
    // on a timer, so each keeps polling live-data in the background instead
    // of reloading (and re-fetching) every time it comes back on screen.
    var BRACKET_HOLD_MS = 60000;   // let the bracket kiosk rotation run for a while
    var SCOREBOARD_HOLD_MS = 20000; // then hold on the live scoreboard

    var bracketFrame = document.getElementById('frame-bracket');
    var scoreboardFrame = document.getElementById('frame-scoreboard');

    function showScoreboard() {
      bracketFrame.classList.remove('active');
      scoreboardFrame.classList.add('active');
      setTimeout(showBracket, SCOREBOARD_HOLD_MS);
    }

    function showBracket() {
      scoreboardFrame.classList.remove('active');
      bracketFrame.classList.add('active');
      setTimeout(showScoreboard, BRACKET_HOLD_MS);
    }

    // Hide the scoreboard's own "All views" link once it loads — it's
    // same-origin, so we can reach into the iframe, and it's redundant chrome
    // on an unattended display that's already wrapped in this kiosk shell.
    scoreboardFrame.addEventListener('load', function () {
      try {
        var link = scoreboardFrame.contentDocument.querySelector('.all-views-link');
        if (link) link.style.display = 'none';
      } catch (e) { /* ignore cross-origin/load-order edge cases */ }
    });

    setTimeout(showScoreboard, BRACKET_HOLD_MS);
  </script>
</body>
</html>
