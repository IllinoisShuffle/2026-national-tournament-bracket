<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Court Scorekeeping</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
:root{--paper:#F4EEDF;--ink:#15151A;--ink-dim:rgba(21,21,26,0.55);--live:#c0392b}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.s-wrap{max-width:420px;margin:0 auto;padding:20px 16px 48px;min-height:100vh;box-sizing:border-box}
.s-header{text-align:center;margin-bottom:18px}
.s-court-label{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--ink-dim);margin-bottom:4px}
.s-header h1{font-size:20px;font-weight:900;margin:0}
.s-empty{text-align:center;color:var(--ink-dim);font-size:14px;padding:24px 8px}
.s-auth-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--ink-dim)}
.s-auth-bar strong{color:var(--ink)}
.s-auth-logout{appearance:none;border:1.5px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit}
.s-login-wrap{max-width:320px;margin:48px auto 0;text-align:center}
.s-login-title{font-size:20px;font-weight:900;margin:0 0 6px}
.s-login-sub{font-size:13px;color:var(--ink-dim);margin:0 0 22px}
.s-login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;text-align:left}
.s-login-field label{font-size:12px;font-weight:700;color:var(--ink-dim)}
.s-login-input{border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);font-size:15px;padding:10px 12px;font-family:inherit;box-sizing:border-box}
.s-login-submit{display:block;width:100%;appearance:none;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:800;padding:14px;cursor:pointer;font-family:inherit;margin-top:6px}
.s-login-submit:disabled{opacity:0.6;cursor:default}
.s-login-error{color:var(--live);font-size:13px;font-weight:700;margin:12px 0 0}
.s-guide-link{font-size:12px;font-weight:700;color:var(--ink-dim);text-decoration:underline}
.s-guide-link-block{display:block;margin-top:16px}
.s-frame-bar{display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.s-frame-label{font-size:13px;font-weight:800;letter-spacing:0.5px;text-align:center}
.s-frame-hint{text-align:center;font-size:11px;color:var(--ink-dim);margin:0}
.s-being-scored{margin-top:8px;font-size:11px;font-weight:700;color:var(--live)}
.s-other-scorer-banner{border:1.5px solid var(--live);color:var(--live);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;margin-bottom:16px;text-align:center}
.s-conflict-banner{border:1.5px solid var(--live);border-radius:12px;padding:14px;margin-bottom:16px;text-align:center}
.s-conflict-text{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 12px}
.s-conflict-actions{display:flex;gap:10px;justify-content:center}
.s-conflict-btn{appearance:none;border:1.5px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font-size:13px;font-weight:800;padding:9px 16px;cursor:pointer;font-family:inherit}
.s-conflict-btn-primary{background:var(--live);border-color:var(--live);color:#fff}
.s-court-toggle{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.s-court-chip{appearance:none;border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;font-family:inherit}
.s-court-chip-active{background:var(--ink);color:var(--paper)}
.s-list{display:flex;flex-direction:column;gap:12px}
.s-match-card{appearance:none;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:14px;text-align:center;font-family:inherit;cursor:pointer}
.s-match-card:active{background:rgba(21,21,26,0.06)}
.s-match-card-complete{border-style:dashed;border-color:var(--ink-dim);background:rgba(21,21,26,0.03);opacity:0.75}
.s-match-complete-tag{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.s-match-id{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--ink-dim);margin-bottom:6px}
.s-match-teams{font-size:15px;font-weight:800}
.s-match-vs{font-size:10px;font-weight:700;color:var(--ink-dim);margin:2px 0}
.s-match-score{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;margin:3px 0}
.s-back{appearance:none;border:none;background:none;color:var(--ink);font-size:14px;font-weight:700;padding:0 0 16px;cursor:pointer;font-family:inherit}
.s-back:disabled{opacity:0.5;cursor:default}
.s-score{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 24px}
.s-side{flex:1;text-align:center;border:2px solid var(--ink);border-radius:14px;padding:16px 8px}
.s-disc{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 8px;border:1.5px solid var(--ink)}
.s-disc-yellow{background:#F2C230}
.s-disc-black{background:#1b1b1b}
.s-side-label{font-size:13px;font-weight:800;margin-bottom:8px;min-height:34px;display:flex;align-items:center;justify-content:center}
.s-score-value{font-size:48px;font-weight:900;font-variant-numeric:tabular-nums;margin-bottom:10px}
.s-stepper-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.s-stepper{appearance:none;border:none;border-radius:8px;background:var(--ink);color:var(--paper);width:100%;aspect-ratio:1;min-height:44px;font-size:19px;font-weight:900;cursor:pointer}
.s-stepper:active{opacity:0.7}
.s-stepper-minus{background:var(--live);color:#fff}
.s-stepper:disabled{opacity:0.35;cursor:default}
.s-stepper-selected{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.s-stepper-selected.s-stepper-minus{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--live)}
.s-stepper-count{font-size:12px;font-weight:700;opacity:0.85}
.s-pending{font-size:12px;font-weight:800;color:var(--live);margin:-4px 0 8px}
.s-pending-hidden{visibility:hidden}
.s-dash{font-size:28px;font-weight:900;color:var(--ink-dim)}
.s-undo-bar{margin:0 0 14px}
.s-undo{display:block;width:100%;appearance:none;border:1.5px solid var(--ink);border-radius:10px;background:none;color:var(--ink);font-size:13px;font-weight:700;padding:11px;cursor:pointer;font-family:inherit}
.s-undo:active{opacity:0.7}
.s-actions{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.s-submit-frame{display:block;width:100%;appearance:none;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:800;padding:14px;cursor:pointer;font-family:inherit}
.s-submit-frame:active{opacity:0.85}
.s-submit-frame:disabled{opacity:0.5;cursor:default}
.s-actions-row{display:flex;gap:8px}
.s-reset-frame,.s-reset-match{flex:1;appearance:none;border:1.5px solid var(--ink);border-radius:10px;background:none;color:var(--ink);font-size:12px;font-weight:700;padding:10px;cursor:pointer;font-family:inherit}
.s-reset-match{border-color:var(--live);color:var(--live)}
.s-reset-frame:active,.s-reset-match:active{opacity:0.7}
.s-reset-frame:disabled,.s-reset-match:disabled{opacity:0.4;cursor:default}
.s-complete{display:block;width:100%;appearance:none;border:none;border-radius:12px;background:var(--live);color:#fff;font-size:16px;font-weight:800;letter-spacing:0.5px;padding:16px;cursor:pointer;font-family:inherit}
.s-complete:active{opacity:0.85}
.s-complete:disabled{opacity:0.5;cursor:default}
.s-status{text-align:center;font-size:12px;font-weight:700;color:var(--ink-dim);margin-top:14px;min-height:16px}
.s-status-error{color:var(--live)}
.s-done{text-align:center;border:2px solid var(--ink);border-radius:14px;padding:24px 16px;margin-bottom:20px}
.s-done-title{font-size:18px;font-weight:900;margin:0 0 8px}
.s-done-score{font-size:20px;font-weight:800;margin:0 0 12px}
.s-done-note{font-size:13px;color:var(--ink-dim);margin:0 0 16px}
.s-reopen{appearance:none;border:1.5px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font-size:12px;font-weight:700;padding:8px 14px;cursor:pointer;font-family:inherit}
.s-reopen:disabled{opacity:0.5;cursor:default}
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="live-data.js"></script>
<script type="text/babel" data-presets="react" src="score.jsx"></script>
</body>
</html>
